

<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Calculator</title>
	<style type="text/css">
		body{
			background-color: deeppink;
		}
		.cal{
			width: 350px;
			box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
			background-color: deepskyblue;
			border-radius: 8px;
			padding-bottom: 10px;
		}
	</style>

</head>
<body>
	<center>	
	<div class="cal">
		<form method="POST">
			{% csrf_token %}
			<h1>CALCULATOR</h1>
			
		<label>Enter 1st number</label>
		<input type="number" name="1st" placeholder="Enter number" required><br><br>
		<label>Enter 2nd number</label>
		<input type="number" name="2nd"placeholder="Enter number"required><br><br>
		<input type="submit" name="btn" value="Calculate">
		</form>
		

	</div>
	<h2>Addition= {{ad}}</h2>
	</center>

</body>
</html>
